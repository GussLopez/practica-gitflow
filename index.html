<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/galeria.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Practica - Gitflow</title>
  </head>
  <body>
    <header
      class="p-4 d-flex justify-content-between align-items-center bg-muted border-bottom"
    >
      <span class="h3">Gitflow</span>
      <nav class="d-flex gap-2">
        <a
          href="/"
          class="px-3 py-2 rounded-3 text-black text-decoration-none fw-semibold link"
          >Juegos</a
        >
        <a
          href="/"
          class="px-3 py-2 rounded-3 text-black text-decoration-none fw-semibold link"
          >Música</a
        >
        <a
          href="/"
          class="px-3 py-2 rounded-3 text-black text-decoration-none fw-semibold link"
          >Videos</a
        >
      </nav>
    </header>
    <main class="container">

  <h2 class="text-center mt-4">Galería de videojuegos</h2>

  <div id="carouselVideojuegos" class="carousel slide">

    <div class="carousel-inner">

      <div class="carousel-item active">
        <img
          src="img/juego1.jpg"
          class="d-block w-100"
          alt="Videojuego 1"
        >
      </div>

      <div class="carousel-item">
        <img
          src="img/juego2.jpg"
          class="d-block w-100"
          alt="Videojuego 2"
        >
      </div>

      <div class="carousel-item">
        <img
          src="img/juego3.jpg"
          class="d-block w-100"
          alt="Videojuego 3"
        >
      </div>

    </div>

    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselVideojuegos"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselVideojuegos"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>

</main>



  <footer class="footer">
    <p>Gitflow</p>
    <p>Práctica de git</p>
  </footer>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  crossorigin="anonymous">
</script>
  </body>
</html>
